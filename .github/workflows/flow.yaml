name: Build and Deploy to Azure VM via ACR

permissions:
  id-token: write  
  contents: read

on:
  push:
    branches:
      - rabbitmq/microservices_Jaiye

jobs:
  build:
    name: Build and Push to Azure ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Set images version
      id: vars
      run: echo "version=${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

    - name: Build and push all services
      run: |
        REGISTRY=${{ secrets.ACR_NAME }}.azurecr.io
        VERSION=${{ steps.vars.outputs.version }}

        docker build -t $REGISTRY/producer:$VERSION ./Producer
        docker push $REGISTRY/producer:$VERSION

        docker build -t $REGISTRY/consumer_health_check:$VERSION ./Consumer_one
        docker push $REGISTRY/consumer_health_check:$VERSION

        docker build -t $REGISTRY/consumer_insert_record:$VERSION ./Consumer_two
        docker push $REGISTRY/consumer_insert_record:$VERSION

        docker build -t $REGISTRY/consumer_delete_record:$VERSION ./Consumer_three
        docker push $REGISTRY/consumer_delete_record:$VERSION

        docker build -t $REGISTRY/consumer_read_database:$VERSION ./Consumer_four
        docker push $REGISTRY/consumer_read_database:$VERSION

        echo "$REGISTRY" | tr -d '\n' > acr_registry.txt

    - name: Upload Registry Info
      uses: actions/upload-artifact@v4
      with:
        name: acr-registry
        path: acr_registry.txt

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.yml

    steps:
    - name: Download Registry Info
      uses: actions/download-artifact@v4
      with:
        name: acr-registry
        path: .

    - name: Read Registry
      id: read_registry
      run: |
        REGISTRY=$(cat acr_registry.txt | tr -d '\n')
        echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV
        echo "REGISTRY=$REGISTRY"

    - name: Debug Environmental Variables
      run: |
        echo "AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}"
        echo "AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}"
        echo "AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}"
        echo "REGISTRY: $REGISTRY"

    - name: SSH and Deploy to Azure VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_VM_HOST }}
        username: ${{ secrets.AZURE_VM_USERNAME }}
        key: ${{ secrets.AZURE_VM_SSH_KEY }}
        port: ${{ secrets.PORT }}
        envs: GITHUB_RUN_NUMBER,REGISTRY,COMPOSE_FILE,AZURE_CLIENT_ID,AZURE_CLIENT_SECRET,AZURE_TENANT_ID,ACR_NAME
        script: |
          set -e
          cd ~/app  # Update if your project is cloned elsewhere

          echo "Debugging inside the VM..."
          echo "AZURE_CLIENT_ID: $AZURE_CLIENT_ID"
          echo "AZURE_CLIENT_SECRET: $AZURE_CLIENT_SECRET"
          echo "AZURE_TENANT_ID: $AZURE_TENANT_ID"
          echo "REGISTRY: $REGISTRY"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "COMPOSE_FILE: $COMPOSE_FILE"

          echo "✅ Updating image tags in docker-compose.yml..."
          yq -i ".services.producer.image = \"${REGISTRY}/producer:${GITHUB_RUN_NUMBER}\"" $COMPOSE_FILE
          yq -i ".services.consumer_health_check.image = \"${REGISTRY}/consumer_health_check:${GITHUB_RUN_NUMBER}\"" $COMPOSE_FILE
          yq -i ".services.consumer_insert_record.image = \"${REGISTRY}/consumer_insert_record:${GITHUB_RUN_NUMBER}\"" $COMPOSE_FILE
          yq -i ".services.consumer_delete_record.image = \"${REGISTRY}/consumer_delete_record:${GITHUB_RUN_NUMBER}\"" $COMPOSE_FILE
          yq -i ".services.consumer_read_database.image = \"${REGISTRY}/consumer_read_database:${GITHUB_RUN_NUMBER}\"" $COMPOSE_FILE

          echo "🔐 Logging into Azure..."
          az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"

          echo "🔄 Logging into ACR..."
          az acr login --name "$ACR_NAME"

          echo "📦 Pulling new images and restarting containers..."
          docker compose pull
          docker compose up -d --force-recreate

          echo "🚀 ✅ Deployment Complete"
