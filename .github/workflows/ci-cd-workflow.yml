name: CI/CD Pipeline for Microservice Communication

on:
  push:
    branches:
      - taiwo-microproject
  pull_request:
    branches:
      - taiwo-microproject

jobs:
  build:
    name: Build and Push Microservice Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push all images to ECR
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: microservice-communication
        run: |
          echo "Building and tagging services..."

          cd Producer
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:producer .
          cd ..

          cd Consumer_one
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:consumer_health_check .
          cd ..

          cd Consumer_two
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:consumer_insert_record .
          cd ..

          cd Consumer_three
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:consumer_delete_record .
          cd ..

          cd Consumer_four
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:consumer_read_database .
          cd ..

          echo "Pushing images to ECR..."

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:producer
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:consumer_health_check
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:consumer_insert_record
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:consumer_delete_record
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:consumer_read_database

          echo "$ECR_REGISTRY" > ecr_registry.txt

      - name: Upload ECR Registry Info
        uses: actions/upload-artifact@v4
        with:
          name: ecr-registry
          path: ecr_registry.txt

  deploy:
    name: Deploy Microservices to Remote Server
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_REPOSITORY: microservice-communication
      DIRECTORY: directory-for-microservices-rabbitmq
      COMPOSE: docker-compose.yml

    steps:
      - name: Download ECR Registry Info
        uses: actions/download-artifact@v4
        with:
          name: ecr-registry
          path: .

      - name: Read ECR Registry
        run: |
          ECR_REGISTRY=$(cat ecr_registry.txt)
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV

      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEEWAI_HOST }}
          username: ${{ secrets.TEEWAI_USERNAME }}
          key: ${{ secrets.TEEWAI_KEY }}
          port: ${{ secrets.PORT }}
          envs: GITHUB_TRIGGERING_ACTOR,GITHUB_RUN_NUMBER,ECR_REGISTRY,ECR_REPOSITORY,DIRECTORY,COMPOSE
          script: |
            echo "Deploying Microservices from $ECR_REGISTRY/$ECR_REPOSITORY"
            cd $DIRECTORY

            for service in producer consumer_health_check consumer_insert_record consumer_delete_record consumer_read_database; do
              yq -y -i "del(.services.${service}.build)" $COMPOSE
              yq -y -i ".services.${service}.image = \"${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}\"" $COMPOSE
            done

            docker compose up --build --force-recreate -d

            if [[ $? == 0 ]]; then
              echo "Deployment Successful!"
            else
              echo "Deployment Failed!"
              exit 1
            fi
